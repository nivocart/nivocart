name: PHPCS

on:
  push:
  pull_request:

jobs:
  phpcs:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS (uses phpcs.xml)
        run: ./upload/system/vendor/bin/phpcs --standard=phpcs.xml
